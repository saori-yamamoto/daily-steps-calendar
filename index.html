<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>習慣化カレンダー</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231769aa'/%3E%3Crect x='12' y='16' width='40' height='36' rx='5' fill='white'/%3E%3Cpath d='M12 25h40' stroke='%23d9dde3' stroke-width='4'/%3E%3Cpath d='M23 39l6 6 13-16' fill='none' stroke='%231769aa' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22 10v10M42 10v10' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #20242a;
      --muted: #6b7280;
      --line: #8c9198;
      --control-line: #aeb4bd;
      --line-soft: #d9dde3;
      --paper: #ffffff;
      --surface: #f5f6f8;
      --pink: #f2386d;
      --blue: #2488d8;
      --sunday: #f23850;
      --sat-bg: #eaf4ff;
      --sun-bg: #fff1f5;
      --today: #fff7d6;
      --project-bg: #fef9e8;
      --project-alt-bg: #fef9e8;
      --project-text: #20242a;
      --active: #2f6fed;
      --active-soft: #eaf2ff;
      --waiting: #f5a524;
      --waiting-soft: #fff5dd;
      --not-started: #8a94a8;
      --not-started-soft: #f1f3f7;
      --done: #2fb36d;
      --done-soft: #e8f8ef;
      --month-col: 72px;
      --project-col: 180px;
      --task-col: 160px;
      --progress-col: 62px;
      --progress-print-col: 11mm;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font-size: 14px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(245, 246, 248, 0.96);
      backdrop-filter: blur(12px);
    }

    .controls {
      display: grid;
      grid-template-columns: 260px;
      gap: 12px;
      align-items: end;
    }

    .view-field {
      display: none;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }

    .month-nav {
      display: grid;
      grid-template-columns: minmax(128px, 1fr) 34px auto 34px;
      gap: 6px;
      align-items: center;
    }

    .month-picker {
      position: relative;
      min-width: 0;
    }

    .month-display-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
      text-align: left;
    }

    .month-display-button:focus-visible {
      outline: 3px solid rgba(23, 105, 170, 0.35);
      outline-offset: 1px;
    }

    .month-calendar-icon {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--ink);
    }

    .month-calendar-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .native-month-input {
      display: none;
    }

    .month-picker-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 50;
      width: 250px;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      background: #fff;
      padding: 12px;
      box-shadow: 0 12px 32px rgba(31, 41, 51, 0.16);
    }

    .month-picker-popover[hidden] {
      display: none;
    }

    .month-picker-head {
      display: grid;
      grid-template-columns: 32px 1fr 32px;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
    }

    .month-picker-year {
      text-align: center;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .month-option {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .month-option:hover,
    .month-option:focus-visible {
      border-color: #b8d6f5;
      background: #eef6ff;
      outline: none;
    }

    .month-option.is-selected {
      border-color: #1769aa;
      background: #1769aa;
      color: #fff;
    }

    .view-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .view-tab {
      border: 0;
      border-right: 1px solid var(--line-soft);
      background: #fff;
      color: var(--muted);
      padding: 0 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .view-tab:last-child {
      border-right: 0;
    }

    .view-tab.is-active {
      background: #1769aa;
      color: #fff;
    }

    .nav-btn {
      min-height: 38px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 9px;
      cursor: pointer;
      font-weight: 700;
      line-height: 1;
    }

    .nav-btn.compact {
      width: 34px;
      padding: 0;
      font-size: 18px;
    }

    .toolbar-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .actions.is-hidden {
      display: none;
    }

    .scope-tabs {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .scope-tab {
      min-height: 36px;
      border: 0;
      border-right: 1px solid var(--line-soft);
      background: #fff;
      color: var(--ink);
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .scope-tab:last-child {
      border-right: 0;
    }

    .scope-tab:hover,
    .scope-tab:focus-visible {
      background: #eef6ff;
      outline: none;
    }

    .scope-tab.is-active {
      background: #1769aa;
      color: #fff;
    }

    .mark-picker {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .mark-picker-label {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 8px;
      border-right: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .mark-option {
      display: inline-grid;
      place-items: center;
      width: 34px;
      min-height: 36px;
      border: 0;
      border-right: 1px solid var(--line-soft);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }

    .mark-option:last-child {
      border-right: 0;
    }

    .mark-option:hover,
    .mark-option:focus-visible {
      background: #eef6ff;
      outline: none;
    }

    .mark-option.is-active {
      background: #1769aa;
      color: #fff;
    }

    .mark-option[data-mark-key="flower"],
    .mark-option[data-mark-key="star"],
    .mark-option[data-mark-key="sakura"] {
      font-size: 18px;
    }

    .progress-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0 2px;
      font-weight: 700;
      cursor: pointer;
    }

    .progress-toggle:focus-visible {
      outline: 3px solid rgba(23, 105, 170, 0.28);
      outline-offset: 3px;
      border-radius: 999px;
    }

    .progress-toggle-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
    }

    .progress-switch {
      position: relative;
      width: 42px;
      height: 24px;
      border: 1px solid #c6ccd4;
      border-radius: 999px;
      background: #e6e9ee;
      box-shadow: inset 0 1px 2px rgba(31, 41, 51, 0.12);
      transition: background 0.16s ease, border-color 0.16s ease;
    }

    .progress-switch-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(31, 41, 51, 0.25);
      transition: transform 0.16s ease;
    }

    .progress-toggle.is-active .progress-toggle-text {
      color: var(--ink);
    }

    .progress-toggle.is-active .progress-switch {
      border-color: #1769aa;
      background: #1769aa;
    }

    .progress-toggle.is-active .progress-switch-knob {
      transform: translateX(18px);
    }

    .settings-menu {
      position: relative;
      z-index: 34;
    }

    .settings-summary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      min-height: 38px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      list-style: none;
    }

    .settings-summary::-webkit-details-marker {
      display: none;
    }

    .settings-summary::after {
      content: none;
    }

    .settings-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 70;
      display: grid;
      min-width: 190px;
      padding: 6px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(17, 24, 39, 0.18);
    }

    .settings-divider {
      height: 1px;
      margin: 5px 2px;
      background: var(--line-soft);
    }

    .settings-action {
      min-height: 36px;
      border: 0;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      font-weight: 700;
      cursor: pointer;
    }

    .settings-action:hover,
    .settings-action:focus-visible {
      background: #f3f5f7;
      outline: none;
    }

    .settings-action.warn {
      color: #b42318;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary {
      border-color: #1769aa;
      background: #1769aa;
      color: #fff;
    }

    .btn.warn {
      border-color: #f0b8b2;
      color: #b42318;
    }

    .workspace {
      padding: 18px;
    }

    .sheet {
      width: min(100%, 1500px);
      margin: 0 auto;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(31, 41, 51, 0.12);
    }

    .sheet + .sheet {
      margin-top: 18px;
    }

    .sheet-title {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--line);
    }

    .sheet-title h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .title-stack {
      display: grid;
      gap: 5px;
    }

    .title-stack p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .sheet-note {
      color: #7a828f;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      text-align: right;
    }

    .sheet-note-row {
      display: flex;
      justify-content: flex-end;
      padding: 0 12px 12px;
    }

    .sheet-title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .board-wrap {
      overflow: auto;
      padding: 0 12px 14px;
    }

    .calendar-board {
      display: grid;
      grid-template-columns: var(--month-col) var(--project-col) var(--task-col) var(--progress-col) repeat(var(--days), minmax(30px, 1fr));
      grid-template-rows: 112px repeat(var(--rows), 38px);
      min-width: calc(var(--month-col) + var(--project-col) + var(--task-col) + var(--progress-col) + var(--days) * 30px);
      background: #fff;
    }

    .calendar-board.progress-hidden {
      --progress-col: 0px;
      --progress-print-col: 0mm;
    }

    .calendar-board.progress-hidden .progress-head,
    .calendar-board.progress-hidden .progress-cell {
      display: none;
    }

    .month-panel {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 2px;
      padding: 10px 10px;
      border-left: 1px solid transparent;
      border-top: 1px solid transparent;
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .month-number {
      font-size: 42px;
      line-height: 0.9;
      font-weight: 300;
      letter-spacing: 0;
    }

    .month-name {
      font-size: 12px;
      line-height: 1.2;
    }

    .year-name {
      font-size: 10px;
      line-height: 1.2;
    }

    .project-head,
    .task-head,
    .progress-head {
      grid-row: 1;
      display: flex;
      align-items: flex-end;
      padding: 0 10px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .project-head {
      grid-column: 2;
      border-left: 1px solid var(--line);
      background: var(--project-bg);
    }

    .task-head {
      grid-column: 3;
      background: #fff;
    }

    .progress-head {
      grid-column: 4;
      justify-content: center;
      background: #fff;
      padding-inline: 6px;
    }

    .date-head {
      display: grid;
      grid-template-rows: auto auto 1fr;
      justify-items: center;
      align-items: start;
      gap: 3px;
      padding-top: 9px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      min-width: 0;
      cursor: pointer;
    }

    .date-head:focus-visible {
      outline: 3px solid rgba(23, 105, 170, 0.35);
      outline-offset: -3px;
      z-index: 2;
    }

    .date-head.sat,
    .check-cell.sat {
      background: var(--sat-bg);
    }

    .date-head.sun,
    .date-head.holiday,
    .check-cell.sun,
    .check-cell.holiday {
      background: var(--sun-bg);
    }

    .date-head.today,
    .check-cell.today {
      background: var(--today);
    }

    .day-num {
      font-size: 21px;
      line-height: 1;
      font-weight: 500;
    }

    .weekday {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    .sat .day-num,
    .sat .weekday {
      color: var(--blue);
    }

    .sun .day-num,
    .sun .weekday,
    .holiday .day-num,
    .holiday .weekday {
      color: var(--sunday);
    }

    .project-cell,
    .task-cell,
    .progress-cell {
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .project-cell {
      border-left: 1px solid var(--line);
      background: var(--project-bg);
    }

    .project-cell.group-even {
      background: var(--project-alt-bg);
    }

    .task-cell {
      background: #fff;
    }

    .progress-cell {
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 0 4px;
      background: #fff;
    }

    .project-cell.menu-open,
    .task-cell.menu-open {
      z-index: 30;
    }

    .project-cell.group-start,
    .task-cell.group-start,
    .progress-cell.group-start,
    .check-cell.group-start {
      box-shadow: none;
    }

    .project-input,
    .task-input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 0 30px 0 9px;
      font-weight: 600;
      font-size: 13px;
    }

    .task-input {
      padding-right: 40px;
    }

    .project-input {
      color: var(--project-text);
      font-weight: 700;
    }

    .group-even .project-input {
      color: var(--project-text);
    }

    .project-cell.has-project-actions .project-input {
      padding-right: 40px;
    }

    .progress-picker {
      position: relative;
      width: 100%;
    }

    .progress-cell.menu-open {
      z-index: 42;
    }

    .progress-select {
      width: 100%;
      min-width: 0;
      height: 26px;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      outline: 0;
      background: #fff;
      color: var(--muted);
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      text-align: center;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0 3px;
    }

    .progress-select:focus-visible {
      border-color: #d99b00;
      box-shadow: 0 0 0 2px rgba(255, 207, 75, 0.32);
    }

    .progress-select::after {
      content: "⌄";
      color: currentColor;
      font-size: 9px;
      line-height: 1;
      opacity: 0.58;
      transform: translateY(-1px);
    }

    .progress-select[data-progress="-"] { background: #f3f5f7; color: #a0a8b3; border-color: #e1e5ea; }
    .progress-select[data-progress="10"] { background: #fffbec; color: #5f4305; }
    .progress-select[data-progress="20"] { background: #fff9de; color: #5f4305; }
    .progress-select[data-progress="30"] { background: #fff6cf; color: #5f4305; }
    .progress-select[data-progress="40"] { background: #fff3bf; color: #5f4305; }
    .progress-select[data-progress="50"] { background: #ffefae; color: #5f4305; }
    .progress-select[data-progress="60"] { background: #ffe99a; color: #5f4305; }
    .progress-select[data-progress="70"] { background: #ffe487; color: #4d3604; border-color: #ffe487; }
    .progress-select[data-progress="80"] { background: #ffdd72; color: #4d3604; border-color: #ffdd72; }
    .progress-select[data-progress="90"] { background: #ffd65e; color: #3f2a02; border-color: #ffd65e; }
    .progress-select[data-progress="100"] { background: #ffcf4b; color: #3f2a02; border-color: #ffcf4b; }

    .progress-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      z-index: 80;
      display: grid;
      width: 68px;
      padding: 4px;
      border: 1px solid #aeb7c2;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(17, 24, 39, 0.22);
      opacity: 1;
      transform: translateX(-50%);
    }

    .progress-menu[hidden] {
      display: none;
    }

    .progress-option {
      height: 25px;
      border: 0;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .progress-option:hover,
    .progress-option:focus-visible {
      outline: 0;
      background: #fff7d6;
    }

    .progress-option.is-active {
      background: #ffefae;
      color: #5f4305;
    }

    .row-menu {
      position: absolute;
      right: 4px;
      z-index: 12;
      opacity: 0.62;
    }

    .row-menu summary {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.86);
      color: #4b5563;
      cursor: pointer;
      font-weight: 900;
      line-height: 1;
      padding: 0;
      list-style: none;
    }

    .row-menu summary::-webkit-details-marker {
      display: none;
    }

    .task-cell:hover .row-menu,
    .project-cell:hover .row-menu,
    .row-menu:focus-within,
    .row-menu[open] {
      opacity: 1;
    }

    .row-menu summary:hover,
    .row-menu summary:focus-visible {
      border-color: #b8c0cc;
      background: #fff;
    }

    .row-menu-popover {
      position: absolute;
      top: 24px;
      right: 0;
      z-index: 40;
      display: grid;
      width: 96px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(31, 41, 51, 0.16);
      overflow: hidden;
    }

    .project-menu .row-menu-popover {
      width: 150px;
    }

    .menu-action {
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
      color: var(--ink);
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .menu-action:last-child {
      border-bottom: 0;
    }

    .menu-action:hover,
    .menu-action:focus-visible {
      background: #eef3f8;
    }

    .menu-action:disabled {
      color: #a6afba;
      cursor: default;
      background: #f7f9fb;
    }

    .menu-action.remove-row {
      color: #b42318;
    }

    .check-cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      color: #1769aa;
    }

    .check-cell::before {
      content: "";
      width: 17px;
      height: 17px;
      border: 1px dashed #c2c8d0;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.62);
    }

    .check-cell.is-checked::before {
      border-style: solid;
      border-color: #1769aa;
      background: #e8f3ff;
    }

    .check-cell.is-checked:not([data-mark-key="check"])::before {
      border-color: transparent;
      background: transparent;
    }

    .check-cell.is-checked::after {
      content: attr(data-mark);
      position: absolute;
      font-size: 17px;
      line-height: 1;
      font-weight: 900;
    }

    .check-cell[data-mark-key="flower"].is-checked::after,
    .check-cell[data-mark-key="star"].is-checked::after,
    .check-cell[data-mark-key="sakura"].is-checked::after {
      font-size: 23px;
      font-weight: 800;
    }

    .check-cell:focus-visible {
      outline: 3px solid rgba(23, 105, 170, 0.35);
      outline-offset: -3px;
      z-index: 2;
    }

    @media (max-width: 860px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .toolbar-actions,
      .actions {
        justify-content: flex-start;
      }

      .actions {
        justify-content: flex-start;
      }

      .workspace {
        padding: 14px;
      }

      .sheet-title {
        grid-template-columns: 1fr;
      }

    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {
        background: #fff;
        font-size: 10px;
      }

      .toolbar {
        display: none;
      }

      [hidden] {
        display: none !important;
      }

      .workspace {
        padding: 0;
      }

      .sheet {
        width: 100%;
        box-shadow: none;
      }

      .sheet-title {
        padding: 0 0 5mm;
      }

      .sheet-title h1 {
        font-size: 15px;
      }

      .sheet-title span {
        font-size: 8px;
      }

      .board-wrap {
        overflow: visible;
        padding: 0;
      }

      .calendar-board {
        width: 100%;
        min-width: 0;
        grid-template-columns: 20mm 28mm 34mm var(--progress-print-col) repeat(var(--days), minmax(0, 1fr));
        grid-template-rows: 31mm repeat(var(--rows), 9.2mm);
      }

      .month-panel {
        padding: 2mm;
      }

      .month-number {
        font-size: 28px;
      }

      .month-name {
        font-size: 8px;
      }

      .year-name,
      .task-head,
      .progress-head,
      .weekday {
        font-size: 6.5px;
      }

      .day-num {
        font-size: 12px;
      }

      .date-head {
        gap: 1.5mm;
        padding-top: 2mm;
      }

      .project-input,
      .task-input,
      .progress-select {
        padding: 0 2mm;
        font-size: 8px;
      }

      .progress-select {
        height: 6mm;
      }

      .progress-select::after,
      .progress-menu {
        display: none !important;
      }

      .row-menu {
        display: none;
      }

      .check-cell,
      .date-head,
      .project-cell,
      .task-cell,
      .progress-cell,
      .month-panel,
      .project-head,
      .task-head,
      .progress-head {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .month-panel,
      .project-head,
      .task-head,
      .progress-head,
      .project-cell,
      .task-cell,
      .progress-cell {
        position: static;
        box-shadow: none;
      }

      .check-cell::before {
        width: 4.8mm;
        height: 4.8mm;
      }

      .check-cell.is-checked::after {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-actions">
      <div class="actions" id="calendarActions">
        <span class="scope-tabs" id="scopeTabs" role="tablist" aria-label="表示範囲">
          <button class="scope-tab" type="button" data-scope-key="work" role="tab">仕事</button>
          <button class="scope-tab" type="button" data-scope-key="life" role="tab">生活</button>
        </span>
        <span class="month-nav">
          <span class="month-picker">
            <button class="month-display-button" id="monthPickerButton" type="button" aria-label="月を選択" aria-haspopup="dialog" aria-expanded="false" aria-controls="monthPickerPopover">
              <span id="monthDisplay">2026年06月</span>
              <span class="month-calendar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="2"></rect>
                  <path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </span>
            </button>
            <input id="monthInput" class="native-month-input" type="month" aria-label="月" tabindex="-1">
            <div class="month-picker-popover" id="monthPickerPopover" role="dialog" aria-label="月を選択" hidden>
              <div class="month-picker-head">

          </span>
          <button class="nav-btn compact" id="prevMonth" type="button" title="前月" aria-label="前月">‹</button>
          <button class="nav-btn" id="currentMonth" type="button">今月</button>
          <button class="nav-btn compact" id="nextMonth" type="button" title="来月" aria-label="来月">›</button>

        <span class="mark-picker" id="markPicker" aria-label="表示マーク">

          <button class="mark-option" type="button" data-mark-key="flower" title="はなまる" aria-label="はなまる">💮</button>
          <button class="mark-option" type="button" data-mark-key="star" title="星" aria-label="星">⭐️</button>

          <summary class="settings-summary" aria-label="設定" title="設定">⚙️</summary>
          <div class="settings-panel">
            <button class="settings-action" id="copyPreviousMonth" type="button">前月からコピー</button>
            <button class="settings-action warn" id="clearMonth" type="button">今月の内容をクリア</button>
            <span class="settings-divider" aria-hidden="true"></span>
            <button class="settings-action" id="exportData" type="button">データを書き出す</button>
            <button class="settings-action" id="importData" type="button">データを読み込む</button>
            <span class="settings-divider" aria-hidden="true"></span>
            <button class="settings-action" id="exportJpegButton" type="button">JPEG書き出し</button>
          </div>
        </details>
        <input id="importDataInput" type="file" accept="application/json,.json" hidden>
      </div>
